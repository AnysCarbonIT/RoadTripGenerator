name: roadtripgenerator

services:
  tests:
    profiles: [tests]
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__RoadTripGeneratorDb: "Host=postgres-test;Port=5432;Database=roadtrip_test;Username=roadtrip_test;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
      RestCountries__ApiKey: integration-tests-not-used
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    profiles: [tests]
    image: postgres:17
    environment:
      POSTGRES_DB: roadtrip_test
      POSTGRES_USER: roadtrip_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadtrip_test -d roadtrip_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5103:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RoadTripGeneratorDb: "Host=postgres;Port=5432;Database=roadtrip_dev;Username=roadtrip;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}"
      RestCountries__ApiKey: ${REST_COUNTRIES_API_KEY:?Define REST_COUNTRIES_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: roadtrip_dev
      POSTGRES_USER: roadtrip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}

    # Accessible uniquement depuis cette machine ; 5433 évite le port PostgreSQL standard.
    ports:
      - "127.0.0.1:5433:5432"

    # Les données restent présentes après docker compose down (sans --volumes).
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadtrip -d roadtrip_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
